name: Site regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  browser-tests:
    name: Build and browser-test the portfolio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
